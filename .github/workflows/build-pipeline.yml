name: Build and Push Pipeline Image

on:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
    # No paths: filter (removed 2026-08-30) -- the Dockerfile's `COPY . .`
    # means almost the whole repo feeds into the image now (dashboard/,
    # tests/, tessdata_best/, etc., none of which were ever added here as
    # the app grew), so a path allowlist silently misses new directories --
    # exactly what happened when a dashboard/-only push never triggered a
    # rebuild. Building on every push is cheap next to that risk.

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            vicharanashala/pop-translation:latest
            vicharanashala/pop-translation:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
