[project]
name = "pop-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # API server
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "python-multipart>=0.0.9",

    # Gemini API
    "google-genai>=1.0.0",

    # PDF processing
    "pymupdf>=1.23.0",

    # HTML processing
    "beautifulsoup4>=4.12.0",

    # DOCX
    "python-docx>=1.1.0",
    "docxcompose>=1.4.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
