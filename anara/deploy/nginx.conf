# Reverse proxy in front of the app container: the only thing published on the host (127.0.0.1:8050). It enforces the
# slow-client and size limits that uvicorn does not. Client address: $remote_addr is the TCP peer, EXCEPT when the peer is the
# tunnel container (fixed address on the edge network), in which case it is the CF-Connecting-IP header that Cloudflare's edge
# sets (it overwrites any client-sent value). From anywhere else (127.0.0.1:8050 on the host) CF-Connecting-IP and
# X-Forwarded-For are ignored. The app gets ONE X-Forwarded-For value: that address.
worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/cb; proxy_temp_path /tmp/pt; fastcgi_temp_path /tmp/fc; uwsgi_temp_path /tmp/uw; scgi_temp_path /tmp/sc;
  client_header_timeout 10s; client_body_timeout 10s; send_timeout 30s; keepalive_timeout 15s; reset_timedout_connection on;
  client_max_body_size 64k; client_header_buffer_size 2k; large_client_header_buffers 4 8k;
  set_real_ip_from 172.29.251.10;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive off;
  limit_conn_zone $remote_addr zone=perip:5m;
  limit_req_zone $remote_addr zone=reqs:5m rate=20r/s;
  resolver 127.0.0.11 valid=5s;
  server {
    listen 8080 default_server;
    server_name _;
    limit_conn perip 20;
    limit_req zone=reqs burst=40 nodelay;
    location / {
      set $up app:8050;
      proxy_pass http://$up;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 90s; proxy_connect_timeout 5s; proxy_send_timeout 30s;
    }
  }
}
